[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-runner"
version = "1.0.0"
description = "Standalone tool-calling loop engine for local Ollama models"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
local-agent-runner = "local_agent_runner.cli:main"

[tool.setuptools]
packages = ["local_agent_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
